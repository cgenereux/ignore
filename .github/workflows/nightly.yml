name: Nightly market history

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated subset (default: all registry tickers)"
        required: false
        default: ""
      sleep-ms:
        description: "Delay between tickers in milliseconds"
        required: false
        default: "1500"
      full:
        description: "Set to true to force full refetch for every ticker"
        required: false
        default: "false"
  schedule:
    # Fallback only — cron-job.org dispatches the punctual run. GitHub fires
    # this 45-60 minutes late in practice, which is still the same session.
    # 21:45 UTC is the earliest hour that stays after the 16:00 New York close
    # in both DST regimes (17:45 EDT / 16:45 EST); closes are final minutes
    # after the bell, so there is no reason to sit on them for hours.
    - cron: "45 21 * * 1-5"

concurrency:
  group: nightly-market-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Skip when tonight's data already landed
        id: freshness
        run: |
          # The 21:45 fallback and the cron-job.org dispatch both fire every
          # night; the concurrency group serializes them, so the second in
          # line starts moments after the first has pushed. Rebuilding the
          # same session a second time wasted ~90 minutes nightly and ended
          # in a same-file rebase conflict every time. A manual run that
          # names tickers or forces a full refetch still goes through.
          git fetch origin main
          TIP_SUBJECT="$(git log -1 --format=%s origin/main)"
          TIP_DATE="$(TZ=America/New_York git log -1 --format=%cd --date=format-local:%Y-%m-%d origin/main)"
          TIP_EPOCH="$(git log -1 --format=%ct origin/main)"
          TODAY="$(TZ=America/New_York date +%F)"
          # Only a commit made after the 16:00 New York close counts as
          # "tonight's data": a mid-session dispatch once committed partial
          # prices as closes, and skipping the real run because of it would
          # have frozen them in.
          CLOSE_EPOCH="$(TZ=America/New_York date -d "$TODAY 16:00" +%s)"
          if [ "$TIP_SUBJECT" = "Nightly market history update" ] && [ "$TIP_DATE" = "$TODAY" ] \
            && [ "$TIP_EPOCH" -ge "$CLOSE_EPOCH" ] \
            && [ -z "${{ github.event.inputs.tickers || '' }}" ] \
            && [ "${{ github.event.inputs.full || 'false' }}" != "true" ]; then
            echo "Tonight's data is already on main; nothing to rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: ${{ steps.freshness.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: ${{ steps.freshness.outputs.skip != 'true' }}
        run: pip install -r requirements.txt

      - name: Restore SEC company-facts cache
        if: ${{ steps.freshness.outputs.skip != 'true' }}
        uses: actions/cache@v4
        with:
          path: .cache/sec-shares
          # Unique key per run: always restores the newest cache via the
          # prefix below, and saves a refreshed copy at the end of the run.
          key: sec-shares-${{ github.run_id }}
          restore-keys: sec-shares-

      - name: Update market history
        if: ${{ steps.freshness.outputs.skip != 'true' }}
        run: |
          # Every trigger (cron-job.org, the 21:45 UTC fallback, manual) fires
          # after the New York close, so today's close is safe to include. Use
          # the New York calendar date.
          END_DATE="$(TZ=America/New_York date +%F)"
          INCREMENTAL="--incremental"
          if [ "${{ github.event.inputs.full || 'false' }}" = "true" ]; then
            INCREMENTAL=""
          fi
          python scripts/update-market-history.py \
            $INCREMENTAL \
            --end "$END_DATE" \
            --sleep-ms "${{ github.event.inputs.sleep-ms || '1500' }}" \
            --tickers "${{ github.event.inputs.tickers || '' }}"

      - name: Archive the day's intraday bars
        if: ${{ !cancelled() && steps.freshness.outputs.skip != 'true' }}
        run: |
          # Gzipped, because this archive is write-only — nothing reads it — and
          # it grew from ~620 KB to ~2.2 MB a day when the feed started carrying
          # the 15m/30m/60m intervals. Committed raw that is over half a gigabyte
          # a year of blobs no reader ever opens, into a repo whose .git is
          # already ~850 MB. Bars are dense numeric JSON and compress ~8x.
          mkdir -p data/intraday
          FILE="data/intraday/$(TZ=America/New_York date +%F).json.gz"
          TMP="$(mktemp)"
          # An empty blob (pre-launch, weekend, holiday) is not worth a commit,
          # and the size test has to happen before compression to stay meaningful.
          if curl -sf https://microtrends.org/api/intraday-bars -o "$TMP" \
            && [ "$(wc -c < "$TMP")" -ge 200 ]; then
            gzip -9 -c "$TMP" > "$FILE"
          fi
          rm -f "$TMP"

      - name: Commit changes (if any)
        id: commit
        # success() and nothing weaker: a failed update once published its
        # half-finished state anyway -- !cancelled() is true after a failed
        # step -- and 2,446 files of mid-session prices reached main as
        # closes. A run either produces a dataset it stands behind or
        # publishes nothing.
        if: ${{ success() && steps.freshness.outputs.skip != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-history data/adjusted data/intraday
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Nightly market history update"
          # main can move during a long run: manual pushes from a dev session
          # raced this push twice on 2026-08-17 and cost the whole night's
          # data to a single rejected attempt. Fetch, replay, push -- three
          # tries. --autostash: any stray unstaged file must never strand
          # the night's commit on the runner again. A genuine rebase
          # conflict aborts loudly rather than guessing.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort
              echo "Rebase conflict against main; refusing to guess." >&2
              exit 1
            fi
            if git push origin main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 30))
          done
          echo "Push failed after three attempts." >&2
          exit 1

      - name: Dispatch the site deploy
        # Fresh data should reach microtrends.org right away instead of
        # waiting for Stock-Tracker's 02:00 UTC fallback cron. GitHub cannot
        # chain workflow_run across repositories, so dispatch deploy.yml over
        # the API. Needs a fine-grained PAT with Actions read/write on
        # Stock-Tracker, stored here as the DEPLOY_DISPATCH_TOKEN secret;
        # until that secret exists this step logs and moves on, and the
        # fallback cron still delivers.
        if: ${{ !cancelled() && steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DEPLOY_DISPATCH_TOKEN not set; skipping the deploy dispatch."
            exit 0
          fi
          gh workflow run deploy.yml -R cgenereux/Stock-Tracker --ref main
