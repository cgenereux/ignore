name: Nightly market history

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated subset (default: all registry tickers)"
        required: false
        default: ""
      sleep-ms:
        description: "Delay between tickers in milliseconds"
        required: false
        default: "1500"
      full:
        description: "Set to true to force full refetch for every ticker"
        required: false
        default: "false"
  schedule:
    # Fallback only — cron-job.org dispatches the punctual run. GitHub fires
    # this 45-60 minutes late in practice, which is still the same session.
    - cron: "15 23 * * 1-5"

concurrency:
  group: nightly-market-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SEC company-facts cache
        uses: actions/cache@v4
        with:
          path: .cache/sec-shares
          # Unique key per run: always restores the newest cache via the
          # prefix below, and saves a refreshed copy at the end of the run.
          key: sec-shares-${{ github.run_id }}
          restore-keys: sec-shares-

      - name: Update market history
        run: |
          # The session has settled by the time this runs (>= 23:15 UTC), so
          # today's close is safe to include. Use the New York calendar date.
          END_DATE="$(TZ=America/New_York date +%F)"
          INCREMENTAL="--incremental"
          if [ "${{ github.event.inputs.full || 'false' }}" = "true" ]; then
            INCREMENTAL=""
          fi
          python scripts/update-market-history.py \
            $INCREMENTAL \
            --end "$END_DATE" \
            --sleep-ms "${{ github.event.inputs.sleep-ms || '1500' }}" \
            --tickers "${{ github.event.inputs.tickers || '' }}"

      - name: Archive the day's intraday bars
        if: ${{ !cancelled() }}
        run: |
          # Gzipped, because this archive is write-only — nothing reads it — and
          # it grew from ~620 KB to ~2.2 MB a day when the feed started carrying
          # the 15m/30m/60m intervals. Committed raw that is over half a gigabyte
          # a year of blobs no reader ever opens, into a repo whose .git is
          # already ~850 MB. Bars are dense numeric JSON and compress ~8x.
          mkdir -p data/intraday
          FILE="data/intraday/$(TZ=America/New_York date +%F).json.gz"
          TMP="$(mktemp)"
          # An empty blob (pre-launch, weekend, holiday) is not worth a commit,
          # and the size test has to happen before compression to stay meaningful.
          if curl -sf https://microtrends.org/api/intraday-bars -o "$TMP" \
            && [ "$(wc -c < "$TMP")" -ge 200 ]; then
            gzip -9 -c "$TMP" > "$FILE"
          fi
          rm -f "$TMP"

      - name: Commit changes (if any)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-history data/adjusted data/intraday
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Nightly market history update"
          # main can move during a long run (manual pushes, other jobs);
          # data commits touch disjoint content, so replay on top.
          # --autostash: any stray unstaged file must never strand the
          # night's commit on the runner again.
          git pull --rebase --autostash origin main
          git push
